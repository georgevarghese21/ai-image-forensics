seed: 42

data:
  manifest: data/processed/debiased/manifest.csv
  crop: 224
  num_workers: 2

model:
  name: forensic_cnn        # forensic_cnn | resnet18 | efficientnet_b0
  pretrained: true

train:
  epochs: 8
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.0001
  early_stop_patience: 3

output_dir: experiments
holdout_generators: []
